<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>cc-hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=Noto+Sans+JP:wght@900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{position:relative;font-family:"Noto Sans JP",sans-serif;color:#fff}

/* ---------- background ---------- */
#bg{position:absolute;inset:0;overflow:hidden;z-index:0;
  background:
    radial-gradient(ellipse 70% 40% at 50% 8%, rgba(255,190,60,.34), transparent 70%),
    radial-gradient(ellipse 60% 22% at 50% 45%, rgba(255,200,80,.18), transparent 70%),
    radial-gradient(ellipse 80% 30% at 50% 55%, rgba(255,160,30,.24), transparent 70%),
    radial-gradient(ellipse 90% 30% at 50% 100%, rgba(200,40,20,.28), transparent 70%),
    #000;}
.bk{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 40% 40%, rgba(255,235,170,.95), rgba(255,190,70,.55) 45%, rgba(255,160,30,0) 72%);
  filter:blur(1px)}
.st{position:absolute;filter:drop-shadow(0 0 7px rgba(255,220,120,.95))}
.st::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle,#fff 0 18%,#fff2b0 45%,rgba(255,230,150,.85) 100%);
  clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%)}
.st::after{content:"";position:absolute;inset:36%;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%)}

/* ---------- siren ---------- */
.siren{position:absolute;width:150px;height:150px;pointer-events:none;z-index:1}
.siren.top{z-index:6}
.siren .rays{position:absolute;left:50%;top:50%;width:320px;height:320px;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(rgba(255,80,60,.42) 0 9deg,transparent 9deg 45deg);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%)}
.siren .ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);
  border:7px solid rgba(255,40,40,.75);box-shadow:0 0 18px rgba(255,40,40,.7),inset 0 0 18px rgba(255,40,40,.5)}
.siren .r1{width:150px;height:150px;opacity:.7}
.siren .r2{width:118px;height:118px;opacity:.85}
.siren .glow{position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(255,70,50,.75),rgba(255,40,40,.25) 40%,rgba(255,40,40,0) 65%)}
.siren .base{position:absolute;left:50%;bottom:22px;width:78px;height:20px;transform:translateX(-50%);
  background:linear-gradient(#777,#222);border-radius:6px 6px 3px 3px;box-shadow:0 3px 6px #000}
.siren .ball{position:absolute;left:50%;top:50%;width:76px;height:76px;transform:translate(-50%,-56%);border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff 0 9%, rgba(255,255,255,.85) 14%, #ff5a4a 30%, #e30f0f 60%, #7a0000 100%);
  box-shadow:0 0 30px rgba(255,50,30,.9),0 0 60px rgba(255,30,10,.6)}
.siren .ball::after{content:"";position:absolute;left:18%;top:12%;width:26%;height:18%;border-radius:50%;background:rgba(255,255,255,.95);filter:blur(1px)}

/* ---------- gold 3D text ---------- */
.gold{position:relative;display:inline-block;font-family:"Dela Gothic One","Noto Sans JP",sans-serif;font-weight:400;line-height:1.05;white-space:nowrap;
  filter:drop-shadow(0 0 14px rgba(255,190,60,.3))}
.gold .gt{position:relative;z-index:3;display:inline-block;
  background:linear-gradient(180deg,#fff9d6 0%,#ffe66a 20%,#ffc51a 42%,#ef9400 58%,#ffd54a 76%,#c96a00 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.gold::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:2;color:#fff;-webkit-text-stroke:var(--st,8px) #fff}
.gold::after{content:attr(data-t);position:absolute;left:0;top:0;z-index:1;color:#000;-webkit-text-stroke:calc(var(--st,8px) + 5px) #000;
  text-shadow:var(--ex)}

/* ---------- layout ---------- */
.row{position:absolute;left:0;width:1080px;text-align:center;z-index:2}

.mincho{font-family:"Shippori Mincho B1","Noto Serif JP",serif;font-weight:800}

/* stripes band */
#band{position:absolute;left:-40px;top:344px;width:1160px;height:130px;transform:rotate(-2.5deg);z-index:2;
  background:repeating-linear-gradient(135deg,#ffd60a 0 36px,#111 36px 72px);
  box-shadow:0 10px 30px rgba(0,0,0,.8),0 0 0 4px #000;}
#band::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(0,0,0,0) 40%,rgba(0,0,0,.25))}
#band .txt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font-family:"Dela Gothic One",sans-serif;font-size:104px;line-height:1;color:#000;letter-spacing:.04em;padding-left:150px;
  text-shadow:0 0 0 #000}
#band .txt .in{position:relative;display:inline-block}
#band .txt .in::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;-webkit-text-stroke:14px #fff;color:#fff}
#stamp{position:absolute;left:96px;top:314px;width:180px;height:180px;border:9px solid #e51414;border-radius:50%;z-index:5;
  transform:rotate(-14deg);color:#e51414;font-family:"Shippori Mincho B1","Noto Serif JP",serif;font-weight:800;font-size:68px;letter-spacing:-.02em;line-height:162px;text-align:center;
  background:rgba(255,255,255,.97);box-shadow:0 0 0 5px rgba(255,255,255,.97),0 12px 30px rgba(0,0,0,.8)}
#stamp::after{content:"";position:absolute;inset:8px;border:3px solid rgba(229,20,20,.7);border-radius:50%}

/* box */
#box{position:absolute;left:70px;top:1306px;width:940px;padding:18px 44px 18px;border-radius:26px;z-index:2;
  background:linear-gradient(180deg,#0a0a0a,#1a1200);
  border:7px solid transparent;
  background-image:linear-gradient(180deg,#0a0a0a,#171000),linear-gradient(180deg,#fff2a8,#f5b71b 40%,#8a4b00 70%,#ffd75c);
  background-origin:border-box;background-clip:padding-box,border-box;
  box-shadow:0 0 0 3px #000,0 0 40px rgba(255,190,60,.35)}
#box h3{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:50px;color:#ffd84a;line-height:1;margin-bottom:10px;
  text-shadow:0 3px 0 #000,0 0 18px rgba(255,190,60,.4)}
#box li{list-style:none;font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:44px;line-height:1.3;color:#fff;display:flex;align-items:center;gap:18px;white-space:nowrap}
#box li .ck{flex:none;width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#ffe86b,#f0a400);box-shadow:0 3px 0 #000;position:relative}
#box li .ck::after{content:"";position:absolute;left:17px;top:9px;width:20px;height:32px;border:solid #000;border-width:0 9px 9px 0;transform:rotate(45deg)}

/* pill */
#pill{position:absolute;left:70px;top:1602px;width:940px;height:100px;border-radius:60px;z-index:2;
  background:linear-gradient(180deg,#fff3b0,#f7c531 45%,#e39a00);
  box-shadow:0 0 0 5px #000,0 0 0 9px #ffd75c,0 12px 30px rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding-left:0;padding-right:24px;gap:22px}
#pill .cico{flex:none;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#333,#000 70%);box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 0 0 4px #ffd75c;
  display:flex;align-items:center;justify-content:center;font-family:"Dela Gothic One",sans-serif;font-size:44px;line-height:1;color:#ffd75c;padding-bottom:5px;padding-left:2px;letter-spacing:.02em}
#pill .t{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:50px;color:#111;line-height:1;white-space:nowrap;letter-spacing:.01em}

/* button */
#btn{position:absolute;left:110px;top:1728px;width:860px;height:128px;border-radius:32px;z-index:5;
  background:linear-gradient(180deg,#ff6a5a 0%,#f21b1b 45%,#b40000 100%);
  border:8px solid #ffd54a;box-shadow:0 0 0 4px #7a4a00,0 0 0 8px #ffe98a,0 14px 0 #5a0000,0 22px 40px rgba(0,0,0,.9),0 0 50px rgba(255,80,40,.5);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
#btn::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.05));border-radius:24px 24px 60% 60%}
#btn .t{position:relative;font-family:"Noto Sans JP",sans-serif;font-weight:900;font-size:50px;color:#fff;white-space:nowrap;letter-spacing:.01em;display:flex;align-items:center;
  text-shadow:0 4px 0 #6a0000,0 0 14px rgba(0,0,0,.6)}
#btn .t::before{content:"";display:inline-block;width:0;height:0;border-style:solid;border-width:20px 0 20px 34px;border-color:transparent transparent transparent #ffe98a;margin-right:16px;
  filter:drop-shadow(0 3px 0 #6a0000)}
#foot{position:absolute;left:0;width:1080px;top:1880px;text-align:center;font-size:30px;line-height:1;font-weight:900;color:#fff;letter-spacing:.05em;opacity:1;text-shadow:0 2px 0 #000;z-index:7}
</style>
</head>
<body>
<div id="bg"></div>

<!-- sirens -->
<div class="siren" style="left:-12px;top:-6px;transform:scale(.8)"><div class="rays"></div><div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div><div class="base"></div><div class="ball"></div></div>
<div class="siren" style="right:-12px;top:-6px;transform:scale(.8)"><div class="rays"></div><div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div><div class="base"></div><div class="ball"></div></div>
<div class="siren" style="left:-16px;top:800px;transform:scale(.7)"><div class="rays"></div><div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div><div class="base"></div><div class="ball"></div></div>
<div class="siren" style="right:-16px;top:800px;transform:scale(.7)"><div class="rays"></div><div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div><div class="base"></div><div class="ball"></div></div>

<!-- 1 -->
<div class="row" style="top:42px">
  <span class="gold" data-t="特別LINEお友達追加特典！" style="font-size:62px;letter-spacing:-.02em;--st:4px;--ex:0 3px 0 #000,0 6px 0 #000,0 9px 0 #000,0 14px 16px rgba(0,0,0,.9)">特別LINEお友達追加特典！</span>
</div>
<!-- 2 -->
<div class="row" style="top:146px">
  <span class="gold mincho" data-t="スキルエンジン" style="font-family:'Shippori Mincho B1','Noto Serif JP',serif;font-weight:800;font-size:140px;letter-spacing:0;--st:3px;--ex:0 3px 0 #000,0 6px 0 #000,0 10px 0 #000,0 16px 18px rgba(0,0,0,.9);filter:drop-shadow(0 0 22px rgba(255,190,60,.5))">スキルエンジン</span>
</div>
<!-- 3 -->
<div id="band"><div class="txt"><span class="in" data-t="完全無料">完全無料</span></div></div>
<div id="stamp">無料</div>
<!-- 4 -->
<div class="row" style="top:528px">
  <span class="gold" data-t="面談予約でさらに" style="font-size:100px;--st:8px;--ex:0 5px 0 #000,0 10px 0 #000,0 15px 0 #000,0 22px 22px rgba(0,0,0,.9)">面談予約でさらに</span>
</div>
<div class="row" style="top:640px">
  <span class="gold" data-t="Claude Code特化" style="font-size:100px;--st:8px;--ex:0 5px 0 #000,0 10px 0 #000,0 15px 0 #000,0 22px 22px rgba(0,0,0,.9)">Claude Code特化</span>
</div>
<!-- 5 -->
<div class="row" style="top:764px">
  <span class="gold" data-t="0→100" style="font-size:190px;letter-spacing:.02em;--st:10px;--ex:0 6px 0 #000,0 12px 0 #000,0 18px 0 #000,0 24px 0 #000,0 32px 26px rgba(0,0,0,.95)">0→100</span>
</div>
<!-- 6 -->
<div class="row" style="top:962px">
  <span class="gold" data-t="20大特典を" style="font-size:140px;--st:9px;--ex:0 6px 0 #000,0 12px 0 #000,0 18px 0 #000,0 26px 24px rgba(0,0,0,.95)">20大特典を</span>
</div>
<div class="row" style="top:1100px">
  <span class="gold" data-t="プレゼント!" style="font-size:140px;--st:9px;--ex:0 6px 0 #000,0 12px 0 #000,0 18px 0 #000,0 26px 24px rgba(0,0,0,.95)">プレゼント!</span>
</div>
<!-- 7 -->
<div class="row mincho" style="top:1250px;font-size:37px;color:#fff;letter-spacing:-.02em;text-shadow:0 3px 0 #000,0 0 14px #000;white-space:nowrap">現役AI×SNSマーケターが直接あなたの現状から徹底指導<span style="font-family:'Noto Serif JP',serif;font-weight:900">！</span></div>
<!-- 8 -->
<div id="box">
  <h3>面談でやること:</h3>
  <ul>
    <li><span class="ck"></span>あなたの現状を一緒に整理する</li>
    <li><span class="ck"></span>SNS運用の型を決める</li>
    <li><span class="ck"></span>AI社員の役割を分ける</li>
  </ul>
</div>
<!-- 9 -->
<div id="pill"><div class="cico">C.</div><div class="t">Claudeに丸投げ最強環境スキル</div></div>
<!-- 10 -->
<div id="btn"><div class="t">爆速0→1突破術を無料でゲット！</div></div>
<!-- 11 -->
<div class="siren top" style="left:-14px;top:1760px;transform:scale(.65)"><div class="rays"></div><div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div><div class="base"></div><div class="ball"></div></div>
<div class="siren top" style="right:-14px;top:1760px;transform:scale(.65)"><div class="rays"></div><div class="glow"></div><div class="ring r1"></div><div class="ring r2"></div><div class="base"></div><div class="ball"></div></div>
<div id="foot">成果には個人差があります</div>

<script>
(function(){
  document.querySelectorAll(".gold").forEach(function(el){var t=el.textContent;el.textContent="";var sp=document.createElement("span");sp.className="gt";sp.textContent=t;el.appendChild(sp);});
  var bg=document.getElementById('bg');
  var seed=7;function r(){seed=(seed*9301+49297)%233280;return seed/233280}
  function rnd(a,b){return a+r()*(b-a)}
  for(var i=0;i<125;i++){
    var d=document.createElement('div');d.className='bk';
    var big=r()<.3;
    var s=big?rnd(60,140):rnd(8,34);
    d.style.width=d.style.height=s+'px';
    d.style.left=(r()*1080-s/2)+'px';d.style.top=(r()*1920-s/2)+'px';
    d.style.opacity=(big?rnd(.3,.52):rnd(.7,1)).toFixed(2);
    if(big)d.style.filter='blur('+rnd(3,8)+'px)';
    bg.appendChild(d);
  }
  for(var j=0;j<65;j++){
    var e=document.createElement('div');e.className='st';
    var huge=j<5;
    var sz=huge?rnd(90,130):rnd(18,64);e.style.width=e.style.height=sz+'px';
    e.style.left=(r()*1080-sz/2)+'px';e.style.top=(r()*1920-sz/2)+'px';
    e.style.opacity=(huge?.35:rnd(.6,1)).toFixed(2);e.style.transform='rotate('+rnd(-20,20)+'deg)';
    bg.appendChild(e);
  }
})();
</script>
</body>
</html>
